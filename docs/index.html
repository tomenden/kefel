<!doctype html>
<html lang="he">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הבמה של יעל</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Karantina:wght@400;700&display=swap">
<style>
/* Layout: one-screen phone app — slim top bar, a scrolling screen area, play screen pins the keypad to the bottom. Theme: backstage dressing room by day, concert night in dark. */
:root{
  --bg:#FFF3F6; --bg-2:#FFE4EE; --surface:#FFFFFF; --surface-2:#F8EAF1; --ink:#3A1838; --muted:#866180; --line:#F1D5E3;
  --accent:#F0287A; --good:#13A070; --bad:#E0503B; --gold:#F2AE1C;
  --lock-filter:brightness(0) opacity(.13);
  --shadow:0 6px 22px -10px rgba(120,20,80,.35);
  --font-display:"Karantina","Fredoka",system-ui,sans-serif;
  --font-body:"Fredoka","Rubik","Arial Hebrew",system-ui,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#170C20; --bg-2:#26112F; --surface:#2A1636; --surface-2:#3A2047; --ink:#FBEAF3; --muted:#C6A4C4; --line:#4A2A5C;
  --good:#3DD69E; --bad:#FF7A66; --gold:#FFCB52; --lock-filter:brightness(0) invert(1) opacity(.15);
  --shadow:0 8px 26px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170C20; --bg-2:#26112F; --surface:#2A1636; --surface-2:#3A2047; --ink:#FBEAF3; --muted:#C6A4C4; --line:#4A2A5C;
  --good:#3DD69E; --bad:#FF7A66; --gold:#FFCB52; --lock-filter:brightness(0) invert(1) opacity(.15);
  --shadow:0 8px 26px -12px rgba(0,0,0,.7); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(90% 45% at 15% -5%, color-mix(in srgb,var(--accent) 22%,transparent), transparent 70%),
    radial-gradient(70% 40% at 95% 0%, color-mix(in srgb,var(--gold) 18%,transparent), transparent 70%),
    var(--bg);
  color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.45;
  -webkit-tap-highlight-color:transparent; overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap}
b{font-weight:700}

#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:8px;padding-block:10px 6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:5px 12px;font-weight:600;font-size:15px;white-space:nowrap}
.chip svg{width:18px;height:18px}
.top .grow{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:18px}
.screen{display:flex;flex-direction:column;gap:14px;animation:in .35s ease}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}

h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--font-display);font-weight:700;line-height:.9;letter-spacing:.5px}
h1.display{font-size:64px}
h2.display{font-size:46px}
.muted{color:var(--muted)}
p{margin:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:99px;padding:14px 22px;font-weight:700;font-size:19px;
  background:var(--accent);color:#fff;box-shadow:0 10px 24px -10px color-mix(in srgb,var(--accent) 80%,transparent);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn svg{width:24px;height:24px}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* home */
.hero{display:flex;flex-direction:column;gap:4px;padding-top:6px}
.hero .hello{font-size:19px;font-weight:600;color:var(--muted)}
.lvl{display:flex;flex-direction:column;gap:8px}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .6s}
.lvl .meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.today{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .bgc{stroke:var(--surface-2)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{font-family:var(--font-body);font-weight:700;font-size:20px;fill:var(--ink)}
.today .txt{display:flex;flex-direction:column;min-width:0}
.cta{font-size:24px;padding:18px 22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:right;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;min-height:112px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.tile .ic svg{width:24px;height:24px}
.tile .ic.sq svg{width:36px;height:36px}
.tile b{font-size:18px}
.tile small{color:var(--muted);font-size:14px;line-height:1.3}
.suggest{display:flex;align-items:center;gap:12px;text-align:right;width:100%}
.suggest .tag{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.3px}
.suggest .go{margin-inline-start:auto;font-size:22px;color:var(--accent)}
.looks{display:flex;gap:10px;flex-wrap:wrap}
.look{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-size:15px;font-weight:600}
.look i{width:22px;height:22px;border-radius:50%;display:block}
.look[aria-pressed="true"]{border-color:var(--ink)}
.look:disabled{opacity:.45;cursor:default}
.sec-title{font-weight:700;font-size:15px;color:var(--muted);letter-spacing:.3px}

/* pick */
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:12px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.mode .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:#fff;flex:none}
.mode .ic svg{width:24px;height:24px}
.mode div{display:flex;flex-direction:column;min-width:0}
.mode small{color:var(--muted);font-size:14px}
.tables{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tbl{aspect-ratio:1;max-width:100%;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;overflow:hidden}
.tbl b{font-size:26px;line-height:1}
.tbl small{font-size:12px;color:var(--muted)}
.tbl .fill{position:absolute;inset:auto 0 0 0;background:color-mix(in srgb,var(--accent) 20%,transparent);z-index:0}
.tbl>*:not(.fill){position:relative}

/* play */
.play{height:100%;display:flex;flex-direction:column;gap:10px}
.lights{display:flex;gap:6px;justify-content:center;direction:ltr}
.lights i{width:22px;height:8px;border-radius:99px;background:var(--surface-2);transition:background .3s}
.lights i.ok{background:var(--accent)}
.lights i.fix{background:var(--gold)}
.lights i.miss{background:var(--bad)}
.lights i.now{background:color-mix(in srgb,var(--accent) 40%,var(--surface-2))}
.crowd{display:flex;align-items:center;gap:10px}
.fan{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;color:var(--muted);flex:none;width:52px;position:relative}
.fan svg{width:42px;height:42px}
.fan.hop svg{animation:hop .5s ease}
@keyframes hop{30%{transform:translateY(-10px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.meter{flex:1;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:center;font-size:12px;color:var(--muted)}
.meter .bar{height:10px}
.say{position:absolute;bottom:100%;white-space:nowrap;background:var(--ink);color:var(--bg);font-size:13px;padding:4px 10px;border-radius:12px;animation:pop .3s ease both;z-index:2}
.fan:first-child .say{right:0}
.fan:last-child .say{left:0}
.qcard{flex:1;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;
  background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:12px}
.qcard.good{animation:glow .6s ease}
.qcard.shake{animation:shake .4s ease}
@keyframes glow{40%{box-shadow:0 0 0 6px color-mix(in srgb,var(--good) 45%,transparent)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.eq{font-weight:700;font-size:clamp(52px,15vw,76px);line-height:1;direction:ltr;display:flex;gap:.25em;align-items:center}
.eq .x{color:var(--accent);font-size:.75em}
.ans{min-width:2.4em;text-align:center;font-weight:700;font-size:clamp(40px,11vw,56px);line-height:1.1;direction:ltr;border-bottom:4px dashed var(--line);color:var(--accent);padding-inline:8px}
.ans.empty{color:var(--line)}
.praise{position:absolute;top:10px;font-family:var(--font-display);font-weight:700;font-size:36px;color:var(--accent);animation:pop .5s ease both}
@keyframes pop{from{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}to{transform:scale(1);opacity:1}}
.hintline{font-size:15px;color:var(--muted);text-align:center;max-width:32ch}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.key{height:clamp(50px,8.4vh,66px);border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:28px;font-weight:600;
  box-shadow:0 3px 0 var(--line);transition:transform .06s}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.key svg{width:26px;height:26px;vertical-align:middle}
.k-hint{font-size:15px;display:flex;align-items:center;justify-content:center;gap:4px;color:var(--gold)}
.k-hint svg{width:22px;height:22px}
.k-del{color:var(--muted)}
.fb{display:flex;flex-direction:column;gap:12px}
.fb .card{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.fb .big{font-size:30px;font-weight:700}
.fb .tip{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:16px;padding:10px 12px;margin-top:10px;font-size:16px}
.fb .tip svg{width:22px;height:22px;flex:none;color:var(--gold);margin-top:2px}

/* result */
.result{align-items:center;text-align:center;padding-top:10px}
.bigstars{display:flex;gap:10px;direction:ltr}
.bigstars svg{width:68px;height:68px;color:var(--surface-2)}
.bigstars svg.on{color:var(--gold);animation:pop .5s ease both}
.bigstars svg:nth-child(2).on{animation-delay:.2s}
.bigstars svg:nth-child(3).on{animation-delay:.4s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column}
.stat b{font-size:28px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:14px}
.unlock{width:100%;display:flex;align-items:center;gap:14px;text-align:right;border:2px solid var(--gold)}
.unlock svg{width:80px;height:80px;flex:none;animation:pop .6s .5s ease both}
.facts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.facts span{background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-radius:99px;padding:3px 10px;font-weight:600;font-size:15px}
.result .btns{display:flex;flex-direction:column;gap:10px;width:100%}

/* tricks */
.tlist{display:flex;flex-direction:column;gap:10px}
.trow{display:flex;align-items:center;gap:12px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.trow .num{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:30px;
  background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);direction:ltr}
.trow div{display:flex;flex-direction:column;min-width:0}
.trow small{color:var(--muted);font-size:14px}
.trow .done{margin-inline-start:auto;color:var(--good);flex:none}
.trow .done svg{width:24px;height:24px}
.lesson p{font-size:18px;line-height:1.55;max-width:60ch}
.lesson .body{display:flex;flex-direction:column;gap:10px}
.demo{display:flex;flex-direction:column;gap:12px;align-items:center}
.stepper{display:flex;align-items:center;gap:14px;direction:ltr}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--surface-2);font-size:24px;font-weight:700}
.stepper .eqs{font-size:30px;font-weight:700;min-width:5ch;text-align:center}
.calc{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:20px}
.calc b{color:var(--accent);font-size:1.15em}
.dots{display:grid;gap:4px;direction:ltr;max-width:100%}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.dots i.b{background:var(--gold)}
.dots i.c{background:var(--good)}
.dots i.ghost{background:var(--surface-2)}
.dots i.cross{background:transparent;border:2px dashed var(--bad)}
.fingers{display:flex;gap:6px;align-items:flex-end;direction:ltr;height:120px}
.fingers .hand{display:flex;gap:4px;align-items:flex-end}
.finger{width:24px;border-radius:12px 12px 8px 8px;background:#F6C9A9;position:relative;transition:height .25s,opacity .25s;display:flex;justify-content:center}
.finger::before{content:"";position:absolute;top:4px;width:16px;height:20px;border-radius:8px 8px 5px 5px;background:var(--nail)}
.finger.down{height:34px!important;opacity:.55}
.finger span{position:absolute;bottom:-20px;font-size:12px;color:var(--muted)}
.finger-out{font-size:18px;text-align:center;min-height:2.8em;margin-top:14px}

/* map */
.grid10{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;direction:ltr}
.grid10 .h{display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--accent);aspect-ratio:1}
.cell{aspect-ratio:1;padding:0;min-width:0;border-radius:8px;display:grid;place-items:center;font-size:clamp(10px,3vw,14px);font-weight:600;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.cell.l1{background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--ink)}
.cell.l2{background:color-mix(in srgb,var(--accent) 38%,var(--surface));color:var(--ink)}
.cell.l3{background:color-mix(in srgb,var(--accent) 65%,var(--surface));color:#fff}
.cell.l4{background:var(--accent);color:#fff;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gold) 80%,transparent)}
.cell.sel{outline:3px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:block}
.info{min-height:84px}

/* squishies */
.sqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sq{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 6px}
.sq svg{width:100%;max-width:92px;height:auto;aspect-ratio:1;transform-origin:50% 90%}
.sq.locked svg{filter:var(--lock-filter)}
.sq b{font-size:15px}
.sq small{font-size:12px;color:var(--muted)}
.sq.tier{border:2px solid var(--gold)}
.rare{position:absolute;top:6px;inset-inline-start:8px;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.3px}
.a-squish svg{animation:squish .5s ease}
.a-bounce svg{animation:bnc .7s ease}
@keyframes bnc{30%{transform:translateY(-26px) scale(.95,1.05)}55%{transform:translateY(0) scale(1.15,.85)}75%{transform:translateY(-8px)}}
.a-spin svg{animation:spn .7s ease}
@keyframes spn{to{transform:rotate(360deg)}}
.a-jelly svg{animation:jly .8s ease}
@keyframes jly{20%{transform:scale(1.25,.75)}40%{transform:scale(.8,1.2)}60%{transform:scale(1.1,.9)}80%{transform:scale(.95,1.05)}}
.a-rainbow svg{animation:rbw 1s linear}
@keyframes rbw{to{filter:hue-rotate(360deg)}}
.a-dance svg{animation:dnc .5s ease-in-out 4}
@keyframes dnc{25%{transform:rotate(-12deg) translateY(-6px)}75%{transform:rotate(12deg) translateY(-6px)}}
.fxp{position:absolute;left:50%;top:35%;pointer-events:none;font-size:22px;font-weight:700;z-index:4;animation:fxup 1.1s ease-out both}
@keyframes fxup{from{transform:translate(-50%,0) scale(.5);opacity:1}to{transform:translate(calc(-50% + var(--dx)),-80px) scale(1.2);opacity:0}}

/* home stage */
.stage{position:relative;overflow:hidden;padding:14px 18% 0;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;
  background:radial-gradient(55% 60% at 50% 0%,color-mix(in srgb,var(--gold) 38%,transparent),transparent 75%),linear-gradient(180deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface) 85%)}
.stage::before,.stage::after{content:"";position:absolute;top:0;bottom:0;width:15%;z-index:2;
  background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 88%,#2a0014) 0 8px,color-mix(in srgb,var(--accent) 62%,#2a0014) 8px 16px);animation:curtain .7s ease}
.stage::before{right:0;border-bottom-left-radius:70% 25%}
.stage::after{left:0;border-bottom-right-radius:70% 25%}
@keyframes curtain{from{width:51%}}
.speech{position:relative;z-index:3;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;font-size:16px;line-height:1.4;text-align:center;box-shadow:var(--shadow);animation:pop .4s ease}
.speech::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--surface)}
.speech .big{font-size:26px;font-weight:700}
.opts{display:flex;gap:8px;justify-content:center;margin-top:8px;direction:ltr}
.opts button{min-width:54px;padding:8px 10px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:20px}
.opts button.right{background:var(--good)}
.opts button.wrong{opacity:.35}
.actor{position:relative;z-index:1;width:104px;height:104px;padding:0;margin-bottom:6px}
.actor svg{width:100%;height:100%;transform-origin:50% 90%}
.actor.gift svg{animation:wig 1.2s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}

/* sprint */
.sprint-meta{display:flex;justify-content:space-between;font-weight:700;font-size:16px}
.timer{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .1s linear}
.fast{position:absolute;bottom:10px;font-size:15px;font-weight:700;color:var(--gold);animation:pop .4s ease}
.ans.wrong{color:var(--bad)}
@keyframes squish{25%{transform:scale(1.22,.72)}55%{transform:scale(.9,1.12)}80%{transform:scale(1.04,.96)}}

.toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:99px;font-weight:600;font-size:15px;z-index:60;animation:pop .3s ease}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" dir="rtl" lang="he">
  <header class="top">
    <button class="iconbtn" id="back" aria-label="חזרה" hidden></button>
    <span class="chip" id="chipStars"></span>
    <span class="grow"></span>

const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function confetti(n=90){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;

  const cols=[getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(),'#F2AE1C','#CDB4FF','#9FE8C8','#FF9EC4','#A9D8FF'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth*(.2+Math.random()*.6),y:innerHeight*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*10-4,r:Math.random()*6+4,c:cols[rnd(cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.3,life:0});

function tick(){const k=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life<150&&p.y<innerHeight+20);
  for(const p of parts){p.life++;p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x*k,p.y*k);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r*k/2,-p.r*k/4,p.r*k,p.r*k/2);cx.restore()}

function tableMastery(n){let s=0;for(let k=1;k<=10;k++)s+=Math.min(4,box(key(n,k)));return s/40}

/* ---------- round engine ---------- */
function weightedPick(keys,n,exclude=new Set()){
  const pool=keys.filter(k=>!exclude.has(k)).map(k=>{const f=S.facts[k],b=f?.box||0;const[a]=k.split('x').map(Number);
    let w=(6-b)**2;if(!f||!f.seen)w*=1.3;else w*=1+Math.min(2,(Date.now()-(f.last||0))/864e5/2);if(a===1)w*=.25;return{k,w}});
  const out=[];
  while(out.length<n&&pool.length){let t=Math.random()*pool.reduce((s,p)=>s+p.w,0),i=0;while((t-=pool[i].w)>0&&i<pool.length-1)i++;out.push(pool.splice(i,1)[0].k)}
  return out;
}
function orient(k){const[a,b]=k.split('x').map(Number);return Math.random()<.5?[a,b]:[b,a]}
function buildPairs(o){
  if(o.mode==='table'){const n=o.n;return shuffle(range(1,10)).slice(0,o.count||10).map(k=>Math.random()<.7?[n,k]:[k,n])}
  if(o.mode==='squares')return shuffle(range(2,10)).slice(0,8).map(k=>[k,k]);
  if(o.mode==='near')return shuffle(range(2,9)).map(k=>orient(key(k,k+1)));
  let keys=[];
  if(o.mode==='weak')keys=weakFacts().slice(0,10);
  keys=keys.concat(weightedPick(FACTS,10-keys.length,new Set(keys)));
  return shuffle(keys).map(orient);
}
function newR(o){return {o,queue:[],total:0,lights:[],firstOk:0,fastN:0,score:0,streak:0,best:0,fresh:[],missT:{},q:null,input:'',locked:false,hinted:false,t0:0,sprint:o.mode==='sprint'}}
function startRound(o){
  const pairs=buildPairs(o);
  R=newR(o);R.queue=pairs.map(([a,b],i)=>({a,b,i,tries:0}));R.total=pairs.length;R.lights=pairs.map(()=>'');
  go('play');renderPlayShell();nextQ();
}
const SPRINT_MS=60000, FAST_MS=4000;
function startSprint(){
  R=newR({mode:'sprint'});R.end=Date.now()+SPRINT_MS;
  go('play');renderPlayShell();nextQ();
  const me=R;
  me.timer=setInterval(()=>{
    if(R!==me){clearInterval(me.timer);return}
    const left=Math.max(0,me.end-Date.now());
    $('#tbar').style.width=(left/SPRINT_MS*100)+'%';
    const sec=Math.ceil(left/1000);
    if(sec!==me.sec){me.sec=sec;$('#tsec').textContent=sec;if(sec<=5&&sec>0)sfx.tick()}
    if(left<=0&&!me.locked){clearInterval(me.timer);finishRound()}
  },100);
}
const PRAISE=['יש!','מדהים!','בול!','כוכבת!','וואו!','מושלם!','איזה ביצוע!','הקהל בטירוף!','שאפו!'];
const PAD=['1','2','3','4','5','6','7','8','9','hint','0','del'];

function nextQ(){
  if(!R)return;

    if(Date.now()>=R.end){clearInterval(R.timer);return finishRound()}
    let k;do{k=weightedPick(FACTS,1)[0]}while(R.q&&k===key(R.q.a,R.q.b));
    const[a,b]=orient(k);R.q={a,b,i:R.total,tries:0};R.total++;
  }else{
    if(!R.queue.length)return finishRound();
    R.q=R.queue.shift();
  }
  R.input='';R.locked=false;R.hinted=false;R.t0=Date.now();

function press(k){

function fanSay(id,txt){const f=$(id);f.classList.remove('hop');void f.offsetWidth;f.classList.add('hop');if(txt){f.querySelector('.say')?.remove();f.insertAdjacentHTML('beforeend',`<span class="say">${txt}</span>`);setTimeout(()=>f.querySelector('.say')?.remove(),1800)}}
/* Spaced-repetition box 0-5. Reaching "mastered" (4+) needs fast recall (<4s), which is what fluency means;
   a slow correct answer caps the box at 3 (or 2 when very slow). */
function check(){
  R.locked=true;
  const q=R.q,ok=+R.input===q.a*q.b,k=key(q.a,q.b),f=F(k),dt=Date.now()-R.t0;
  const first=q.tries===0,clean=first&&!R.hinted,fast=dt<FAST_MS;
  if(first)f.seen++;
  f.last=Date.now();
  S.answers++;S.days[today()]=(S.days[today()]||0)+1;
  const qc=$('#qcard');
  if(ok){
    f.ok++;
    if(clean){const before=f.box;f.box=Math.min(fast?5:dt<8000?3:2,f.box+1);R.firstOk++;if(fast)R.fastN++;if(before<4&&f.box>=4&&!R.fresh.includes(k))R.fresh.push(k)}
    if(R.sprint){R.score++;$('#tscore').textContent=R.score}else R.lights[q.i]=clean?'ok':'fix';
    R.streak++;R.best=Math.max(R.best,R.streak);
    sfx.good(R.streak-1);buzz(15);
    qc.classList.add('good');
    qc.insertAdjacentHTML('afterbegin',`<span class="praise">${PRAISE[rnd(PRAISE.length)]}</span>`);
    if(clean&&fast&&!R.sprint)qc.insertAdjacentHTML('beforeend',`<span class="fast">⚡ ${eq((dt/1000).toFixed(1))} שניות</span>`);
    $('#meter').style.width=Math.min(100,R.streak*12)+'%';
    if(R.streak===3)fanSay('#fanSol','יאללה יעל!');
    else if(R.streak===5)fanSay('#fanBerry','אגו! גו!');
    else if(R.streak===8){fanSay('#fanSol','עוד! עוד!');fanSay('#fanBerry','');}
    else if(R.streak%2===0)fanSay(Math.random()<.5?'#fanSol':'#fanBerry','');
    if(R.streak>=5&&R.streak%5===0)confetti(40);
    let wait=first?650:900;
    // Slow but correct = she probably counted. That is the moment the shortcut is worth showing.
    if(clean&&dt>=7000&&!R.sprint){$('#hintline').innerHTML=`<b>נכון!</b> קיצור דרך לפעם הבאה: ${hintFor(q.a,q.b,true)}`;wait=3000}
    if(R.sprint)wait=350;
    save();drawLights();
    setTimeout(nextQ,wait);
  }else{
    if(first){f.miss++;f.box=Math.max(0,f.box-2);const t=trickOf(q.a,q.b);R.missT[t]=(R.missT[t]||0)+1}
    q.tries++;R.streak=0;$('#meter').style.width='0';
    sfx.bad();buzz([30,40,30]);
    qc.classList.add('shake');
    save();
    if(R.sprint){
      const a=$('#ans');a.textContent=q.a*q.b;a.classList.add('wrong');
      $('#hintline').innerHTML=hintFor(q.a,q.b,true);
      setTimeout(nextQ,2200);return;
    }
    if(!R.lights[q.i])R.lights[q.i]='miss';
    if(q.tries<3)R.queue.splice(Math.min(2,R.queue.length),0,q);
    drawLights();
    $('#pad').hidden=true;
    $('#fb').hidden=false;
    $('#fb').innerHTML=`<div class="card">
        <div class="muted">כמעט! התשובה הנכונה:</div>
        <div class="big">${eq(`${q.a} × ${q.b} = ${q.a*q.b}`)}</div>
        <div class="tip">${ICON.bulb}<span>${hintFor(q.a,q.b,true)}</span></div>
      </div>
      <button class="btn" id="cont">הבנתי, ממשיכים</button>`;
    $('#cont').onclick=()=>{sfx.tap();nextQ()};
    $('#cont').focus({preventScroll:true});
  }
}

function grantStars(n){
  const bOwned=S.owned,bLooks=LOOKS.filter(l=>S.stars>=l.at).length,bLevel=levelOf(S.stars);
  S.stars+=n;
  S.owned=Math.min(SQ.length,Math.max(S.owned,1+Math.floor(S.stars/STARS_PER_SQUISHY)));
  const li=levelOf(S.stars);
  return {newSq:range(bOwned,S.owned-1).map(i=>SQ[i]),newLook:LOOKS.filter(l=>S.stars>=l.at).length>bLooks,levelUp:li>bLevel,li};
}
function finishRound(){
  const r=R;R=null;if(r.timer)clearInterval(r.timer);
  let stars,title,stats;
  if(r.sprint){
    const prev=S.best60,rec=r.score>prev;if(rec)S.best60=r.score;
    stars=1+(r.score>=12?1:0)+((rec&&prev>0)||r.score>=22?1:0);
    title=rec&&prev>0?'שיא חדש!':r.score>=12?'איזה ספרינט!':'כל הכבוד על הריצה!';
    stats=[[r.score,'נכונות בדקה אחת'],[S.best60,'השיא שלך'],[r.best,'הרצף הכי ארוך'],[r.total-r.score,'טעויות ללמוד מהן']];
  }else{
    const acc=r.firstOk/r.total;stars=acc>=.9?3:acc>=.7?2:1;
    title=stars===3?'הופעה מושלמת!':stars===2?'איזה ביצוע!':'כל הכבוד על האימון!';
    stats=[[`${r.firstOk}/${r.total}`,'נכון בפעם הראשונה'],[r.best,'הרצף הכי ארוך'],[r.fastN,'תשובות ⚡ מתחת ל-4 שניות'],[null,'בשליטה בכל הלוח']];
  }
  S.rounds++;
  const t=today();if(S.lastDay!==t){S.streak=S.lastDay===yesterday()?S.streak+1:1;S.lastDay=t}
  const g=grantStars(stars);
  if(r.o.trick)S.tricks[r.o.trick]=true;
  save();pushRemote();
  if(!r.sprint)stats[3][0]=`${masteredCount()}/${FACTS.length}`;
  const top=Object.entries(r.missT).sort((x,y)=>y[1]-x[1])[0];
  const sugT=top&&top[1]>=2?TRICKS.find(x=>x.id===top[0]):null;
  go('result');
  $('#s-result').innerHTML=`
    <h2 class="display">${title}</h2>
    <div class="bigstars">${[0,1,2].map(i=>ICON.star.replace('<svg',`<svg class="${i<stars?'on':''}"`)).join('')}</div>
    ${g.levelUp?`<div class="card" style="width:100%;border:2px solid var(--accent)"><b>עלית שלב!</b> עכשיו את ב<b>${LEVELS[g.li][1]}</b></div>`:''}
    <div class="stats">${stats.map(([v,l])=>`<div class="stat"><b class="ltr">${v}</b><small>${l}</small></div>`).join('')}</div>
    ${r.fresh.length?`<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><span class="muted">תרגילים שעכשיו את שולטת בהם:</span><div class="facts">${r.fresh.map(k=>{const[a,b]=k.split('x');return `<span class="ltr">${a} × ${b} = ${a*b}</span>`}).join('')}</div></div>`:''}
    ${sugT?`<div class="card" style="width:100%;text-align:right;display:flex;flex-direction:column;gap:10px"><span>הכי הרבה טעויות היו בתרגילים של <b>${sugT.title}</b>. הטריק "${sugT.sub}" יעזור!</span><button class="btn ghost" id="sugTrick">${ICON.bulb} לטריק</button></div>`:''}
    ${g.newSq.map(q=>`<div class="card unlock">${sqSVG(q)}<div><span class="muted">סקווישי חדש הצטרף לאוסף!</span><h3 style="font-size:26px">${q.n}</h3></div></div>`).join('')}
    ${g.newLook?`<div class="card" style="width:100%">נפתח לוק חדש! אפשר לבחור אותו בעמוד הבית.</div>`:''}
    ${!g.newSq.length&&S.owned<SQ.length?`<p class="muted">עוד <span class="ltr">${S.owned*STARS_PER_SQUISHY-S.stars}</span> כוכבים לסקווישי הבא</p>`:''}
    <div class="btns">
      <button class="btn" id="again">${r.sprint?ICON.bolt:ICON.mic} ${r.sprint?'עוד ספרינט':'הדרן! עוד סיבוב'}</button>
      <button class="btn ghost" id="home">לחדר ההלבשה</button>
    </div>`;
  $('#again').onclick=()=>r.sprint?startSprint():startRound(r.o.trick?{mode:'mix'}:r.o);
  $('#home').onclick=()=>go('home');
  if(sugT)$('#sugTrick').onclick=()=>{trickId=sugT.id;go('trick')};
  sfx.fanfare();confetti(stars===3?140:80);
}

/* ---------- tricks ---------- */
function renderTricks(){
  $('#s-tricks').innerHTML=`
    <h2 class="display">ארגז הסודות</h2>
    <p class="muted">כל טריק הופך תרגילים קשים לקלים. כדאי לעבור לפי הסדר.</p>
    <div class="tlist">${TRICKS.map(t=>`<button class="trow" data-t="${t.id}"><span class="num">${t.label}</span><div><b>${t.title}</b><small>${t.sub}</small></div>${S.tricks[t.id]?`<span class="done">${ICON.check}</span>`:''}</button>`).join('')}</div>`;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{trickId=b.dataset.t;go('trick')});
}
let demoM=4,swapRot=false;
function dotsHTML(rows,cols,groups){
  let cls=[];groups.forEach(([n,c])=>{for(let i=0;i<n;i++)cls.push(c)});
  let h='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)h+=`<i class="${cls[r]||'a'}"></i>`;
  return `<div class="dots" style="grid-template-columns:repeat(${cols},14px)">${h}</div>`;
}
function renderTrick(){
  const t=TRICKS.find(x=>x.id===trickId);if(!t)return go('tricks');
  $('#s-trick').innerHTML=`
    <h2 class="display">${t.title}</h2>
    <span class="muted" style="margin-top:-8px">${t.sub}</span>
    <div class="body">${t.body.map(p=>`<p>${bidi(p)}</p>`).join('')}</div>
    <div class="card demo" id="demo"></div>
    <button class="btn" id="drill">${ICON.mic} בואי נתרגל את זה</button>`;
  demoM=t.id==='swap'?7:4;swapRot=false;
  drawDemo(t);
  $('#drill').onclick=()=>startRound(Object.assign({},t.drill,{count:8,trick:t.id}));
}
function drawDemo(t){
  const d=$('#demo');
  if(t.demo==='fingers'&&!d.dataset.f){
    d.dataset.f=1;
    const nails=['#FF5C9A','#B98CE0','#FFB020','#4CC9A0','#5AAEFF','#5AAEFF','#4CC9A0','#FFB020','#B98CE0','#FF5C9A'];
    const hs=[70,92,100,94,60,60,94,100,92,70];
    d.insertAdjacentHTML('beforebegin',`<div class="card demo"><b>טריק האצבעות: הקישי על אצבע</b><div class="fingers"><div class="hand">${range(1,5).map(i=>`<button class="finger" data-f="${i}" style="height:${hs[i-1]}px;--nail:${nails[i-1]}" aria-label="אצבע ${i}"><span>${i}</span></button>`).join('')}</div><div class="hand">${range(6,10).map(i=>`<button class="finger" data-f="${i}" style="height:${hs[i-1]}px;--nail:${nails[i-1]}" aria-label="אצבע ${i}"><span>${i}</span></button>`).join('')}</div></div><div class="finger-out" id="fout">איזו אצבע לקפל?</div></div>`);
    document.querySelectorAll('.finger').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.f;document.querySelectorAll('.finger').forEach(x=>x.classList.toggle('down',x===b));sfx.good(i-1);
      $('#fout').innerHTML=`${i-1} אצבעות משמאל (עשרות), ${10-i} מימין (אחדות)<br><b style="color:var(--accent);font-size:24px">${eq(`9 × ${i} = ${9*i}`)}</b>`;
    });
  }
  const m=demoM;
  let eqTxt,grid,lines;
  if(t.id==='swap'){
    const r=swapRot?m:3,c=swapRot?3:m;
    eqTxt=`${r} × ${c}`;grid=dotsHTML(r,c,[[r,'a']]);lines=[`${eq(`${r} × ${c} = <b>${3*m}</b>`)}`];
  }else if(t.near){
    const k=Math.min(m,9);
    eqTxt=`${k} × ${k+1}`;grid=dotsHTML(k+1,k,[[k,'a'],[1,'b']]);lines=t.calc(k);
  }else{
    const n=t.square?m:+t.drill.n||1;
    eqTxt=t.square?`${m} × ${m}`:`${n} × ${m}`;
    const g=t.groups(m),rows=g.reduce((s,x)=>s+x[0],0);
    grid=dotsHTML(t.square?m:rows,m,g);lines=t.calc(m);
  }
  d.innerHTML=`
    <div class="stepper"><button id="mMinus" aria-label="פחות">−</button><span class="eqs">${eqTxt}</span><button id="mPlus" aria-label="יותר">+</button></div>
    <div class="calc">${lines.map(l=>`<span>${l}</span>`).join('')}</div>
    <div style="max-width:100%;overflow-x:auto">${grid}</div>
    ${t.id==='swap'?`<button class="btn ghost" id="rot">${ICON.shuffle} סובבי את הציור</button>`:''}`;
  $('#mMinus').onclick=()=>{demoM=Math.max(1,demoM-1);sfx.tap();drawDemo(t)};
  $('#mPlus').onclick=()=>{demoM=Math.min(10,demoM+1);sfx.tap();drawDemo(t)};
  if($('#rot'))$('#rot').onclick=()=>{swapRot=!swapRot;sfx.tap();drawDemo(t)};
}

/* ---------- map ---------- */
const LVL_NAMES=['עוד לא ניסינו','מתחילות','מתקדמות','כמעט','שולטת!'];
function lvlClass(k){const f=S.facts[k];if(!f||!f.seen)return '';const b=f.box;return b>=4?'l4':b>=3?'l3':b>=2?'l2':'l1'}
function renderMap(){
  const m=masteredCount();
  let g='<span class="h" style="color:var(--muted)">×</span>'+range(1,10).map(n=>`<span class="h">${n}</span>`).join('');
  for(let a=1;a<=10;a++){g+=`<span class="h">${a}</span>`;for(let b=1;b<=10;b++)g+=`<button class="cell ${lvlClass(key(a,b))}" data-a="${a}" data-b="${b}" aria-label="${a} כפול ${b}">${a*b}</button>`}
  $('#s-map').innerHTML=`
    <h2 class="display">המפה שלי</h2>
    <div class="stats">
      <div class="stat"><b class="ltr">${m}/${FACTS.length}</b><small>תרגילים שאת שולטת בהם</small></div>
      <div class="stat"><b class="ltr">${S.answers}</b><small>תשובות בסך הכל</small></div>
      <div class="stat"><b class="ltr">${S.rounds}</b><small>הופעות</small></div>
      <div class="stat"><b class="ltr">${S.streak}</b><small>ימים ברצף</small></div>
    </div>
    <div class="grid10">${g}</div>
    <div class="legend">${['','l1','l2','l3','l4'].map((c,i)=>`<span><i class="cell ${c}" style="aspect-ratio:auto"></i>${LVL_NAMES[i]}</span>`).join('')}</div>
    <div class="card info" id="info"><span class="muted">הקישי על משבצת כדי לראות פרטים וטריק.</span></div>
    <p class="muted" style="font-size:14px">טיפ: ${eq('3 × 7')} ו-${eq('7 × 3')} נספרים יחד, ולכן יש 55 תרגילים ולא 100.</p>`;
  document.querySelectorAll('.cell[data-a]').forEach(c=>c.onclick=()=>{
    document.querySelectorAll('.cell.sel').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');
    const a=+c.dataset.a,b=+c.dataset.b,f=S.facts[key(a,b)];
    $('#info').innerHTML=`<b style="font-size:22px">${eq(`${a} × ${b} = ${a*b}`)}</b>
      <div class="muted">${f&&f.seen?`ענית נכון ${f.ok} פעמים, טעית ${f.miss} · ${LVL_NAMES[lvlClass(key(a,b))?(+lvlClass(key(a,b))[1]):0]}`:'עוד לא תרגלת את זה'}</div>
      <div style="margin-top:6px">${hintFor(a,b,true)}</div>`;
  });
}

/* ---------- squishies ---------- */
function renderSquish(){
  $('#s-squish').innerHTML=`
    <h2 class="display">האוסף שלי</h2>
    <p class="muted">כל ${STARS_PER_SQUISHY} כוכבים מביאים סקווישי חדש, ולכל אחד יש קסם משלו. הקישי עליהם!</p>
    <div class="sqgrid">${SQ.map((q,i)=>{const tier=i===SQ.length-1?'אגדי':i>=22?'נדיר':'';
      return i<S.owned?`<button class="sq ${tier?'tier':''}" data-i="${i}">${tier?`<span class="rare">${tier}</span>`:''}${sqSVG(q)}<b>${q.n}</b></button>`
        :`<div class="sq locked">${sqSVG(q)}<b>?</b><small>ב-${i*STARS_PER_SQUISHY} ★</small></div>`}).join('')}</div>`;
  document.querySelectorAll('button.sq').forEach(b=>b.onclick=()=>squishFx(b,+b.dataset.i));
}

/* ---------- boot ---------- */
applyLook();go('home');
</script>
